<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1200" viewBox="0 0 540 1200">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#142b36" />
      <stop offset="40%" stop-color="#1c4352" />
      <stop offset="80%" stop-color="#153642" />
      <stop offset="100%" stop-color="#0c1f28" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(33, 71, 87, 0.65)" />
      <stop offset="100%" stop-color="rgba(19, 44, 56, 0.85)" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="540" height="1200" fill="url(#bgGrad)" />

  <!-- Equalizer bar motif along edges -->
  <g fill="rgba(42, 85, 102, 0.45)">
    <rect x="0" y="80" width="8" height="70" />
    <rect x="0" y="170" width="12" height="90" />
    <rect x="0" y="980" width="10" height="80" />
    <rect x="0" y="1080" width="6" height="50" />
    <rect x="528" y="80" width="12" height="80" />
    <rect x="532" y="180" width="8" height="60" />
    <rect x="526" y="980" width="14" height="70" />
    <rect x="530" y="1070" width="10" height="60" />
  </g>

  <!-- Status Bar -->
  <text x="32" y="32" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">10:02</text>
  <g fill="#ffffff" transform="translate(470, 20) scale(0.8)">
    <path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4z" />
    <path d="M40 8v12h4V8h-4zm2-6a2 2 0 0 0-2 2v2h4V4a2 2 0 0 0-2-2z" transform="translate(14, -2)" />
  </g>

  <!-- Song Title -->
  <text x="270" y="78" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="28" font-weight="500" text-anchor="middle">Closer Than Ever</text>

  <!-- Player Card -->
  <rect x="40" y="108" width="460" height="156" rx="20" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  
  <text x="64" y="136" fill="#8da9b5" font-family="-apple-system, sans-serif" font-size="13">00:18</text>
  <text x="476" y="136" fill="#8da9b5" font-family="-apple-system, sans-serif" font-size="13" text-anchor="end">04:04</text>
  
  <!-- Scrubber -->
  <rect x="64" y="152" width="412" height="3" rx="1.5" fill="rgba(255, 255, 255, 0.2)" />
  <rect x="64" y="152" width="42" height="3" rx="1.5" fill="#ffffff" />
  
  <text x="76" y="218" fill="#c3d9e3" font-family="-apple-system, sans-serif" font-size="15" font-weight="500">1.0x</text>
  
  <!-- Pause Button -->
  <g transform="translate(254, 196)">
    <rect x="0" y="0" width="8" height="30" rx="3" fill="#ffffff" />
    <rect x="18" y="0" width="8" height="30" rx="3" fill="#ffffff" />
  </g>

  <!-- Lyrics / Dual Language script -->
  <g text-anchor="middle" font-family="-apple-system, sans-serif">
    <!-- Verse lines preceding -->
    <text x="270" y="310" fill="#7599a8" font-size="16">Мы можем быть далеко</text>
    <text x="270" y="348" fill="#7599a8" font-size="15">We can be far apart</text>

    <text x="270" y="400" fill="#7599a8" font-size="16">Но всё равно на связи</text>
    <text x="270" y="438" fill="#7599a8" font-size="15">But still stay connected</text>

    <text x="270" y="490" fill="#7599a8" font-size="16">Сообщение приходит</text>
    <text x="270" y="528" fill="#7599a8" font-size="15">A message comes through</text>

    <text x="270" y="580" fill="#7599a8" font-size="16">Всего за секунду</text>
    <text x="270" y="618" fill="#7599a8" font-size="15">In just a second</text>

    <!-- ACTIVE HIGHLIGHTED LINE -->
    <text x="270" y="686" fill="#ffffff" font-size="28" font-weight="700">Я вижу твоё лицо</text>
    <text x="270" y="730" fill="#c4e2ec" font-size="18" font-weight="500">I can see your face</text>

    <!-- Lines following -->
    <text x="270" y="792" fill="#7599a8" font-size="16">Через яркий экран</text>
    <text x="270" y="830" fill="#7599a8" font-size="15">Through a bright screen</text>

    <text x="270" y="882" fill="#7599a8" font-size="16">И слышу твой голос</text>
    <text x="270" y="920" fill="#7599a8" font-size="15">And hear your voice</text>

    <text x="270" y="972" fill="#7599a8" font-size="16">Из другого города</text>
    <text x="270" y="1010" fill="#7599a8" font-size="15">From another city</text>

    <text x="270" y="1062" fill="#7599a8" font-size="16">Мы делимся новостями</text>
  </g>

  <!-- Bottom Navigation Pill -->
  <rect x="120" y="1090" width="300" height="74" rx="37" fill="rgba(19, 44, 56, 0.92)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  <!-- Music Tab Active -->
  <rect x="140" y="1102" width="76" height="50" rx="20" fill="rgba(88, 140, 161, 0.45)" />
  <circle cx="178" cy="1127" r="8" fill="#ffffff" />
  <rect x="183" y="1116" width="3" height="11" fill="#ffffff" />

  <!-- Library Tab -->
  <g transform="translate(262, 1114)" fill="#8da9b5">
    <rect x="0" y="0" width="22" height="24" rx="3" fill="none" stroke="#8da9b5" stroke-width="2" />
    <circle cx="11" cy="13" r="4" fill="#8da9b5" />
  </g>

  <!-- Settings Tab -->
  <g transform="translate(348, 1114)" fill="#8da9b5">
    <circle cx="12" cy="12" r="5" stroke="#8da9b5" stroke-width="2" fill="none" />
    <path d="M12 1v3M12 20v3M1 12h3M20 12h3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" stroke="#8da9b5" stroke-width="2" />
  </g>

  <!-- Android Home Indicator -->
  <rect x="210" y="1186" width="120" height="4" rx="2" fill="#ffffff" opacity="0.6" />
</svg>
