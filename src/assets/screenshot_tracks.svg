<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1200" viewBox="0 0 540 1200">
  <defs>
    <linearGradient id="bgTracksGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#142b36" />
      <stop offset="50%" stop-color="#183c4b" />
      <stop offset="100%" stop-color="#0e232d" />
    </linearGradient>
    <linearGradient id="trackCardGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(29, 60, 75, 0.75)" />
      <stop offset="100%" stop-color="rgba(19, 44, 56, 0.85)" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="540" height="1200" fill="url(#bgTracksGrad)" />

  <!-- Status Bar -->
  <text x="32" y="32" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">10:02</text>
  <g fill="#ffffff" transform="translate(470, 20) scale(0.8)">
    <path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4z" />
    <path d="M40 8v12h4V8h-4zm2-6a2 2 0 0 0-2 2v2h4V4a2 2 0 0 0-2-2z" transform="translate(14, -2)" />
  </g>

  <!-- Header -->
  <text x="270" y="76" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="28" font-weight="500" text-anchor="middle">Tracks</text>

  <!-- Track items -->
  <!-- 1. Little by Little -->
  <g transform="translate(36, 114)">
    <rect width="468" height="74" rx="16" fill="url(#trackCardGrad)" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1" />
    <text x="22" y="32" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="17" font-weight="500">Little by Little</text>
    <text x="22" y="55" fill="#8ca9b7" font-family="-apple-system, sans-serif" font-size="13">A2 · 1:57</text>
  </g>

  <!-- 2. Turning a New Page -->
  <g transform="translate(36, 202)">
    <rect width="468" height="74" rx="16" fill="url(#trackCardGrad)" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1" />
    <text x="22" y="32" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="17" font-weight="500">Turning a New Page</text>
    <text x="22" y="55" fill="#8ca9b7" font-family="-apple-system, sans-serif" font-size="13">B1 · 4:23</text>
  </g>

  <!-- 3. Morning Routine -->
  <g transform="translate(36, 290)">
    <rect width="468" height="74" rx="16" fill="url(#trackCardGrad)" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1" />
    <text x="22" y="32" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="17" font-weight="500">Morning Routine</text>
    <text x="22" y="55" fill="#8ca9b7" font-family="-apple-system, sans-serif" font-size="13">A2 · 2:30</text>
  </g>

  <!-- 4. Plans for the Weekend -->
  <g transform="translate(36, 378)">
    <rect width="468" height="74" rx="16" fill="url(#trackCardGrad)" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1" />
    <text x="22" y="32" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="17" font-weight="500">Plans for the Weekend</text>
    <text x="22" y="55" fill="#8ca9b7" font-family="-apple-system, sans-serif" font-size="13">B1 · 2:54</text>
  </g>

  <!-- 5. At a Restaurant -->
  <g transform="translate(36, 466)">
    <rect width="468" height="74" rx="16" fill="url(#trackCardGrad)" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1" />
    <text x="22" y="32" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="17" font-weight="500">At a Restaurant</text>
    <text x="22" y="55" fill="#8ca9b7" font-family="-apple-system, sans-serif" font-size="13">A2 · 3:19</text>
  </g>

  <!-- 6. Closer Than Ever -->
  <g transform="translate(36, 554)">
    <rect width="468" height="74" rx="16" fill="url(#trackCardGrad)" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1" />
    <text x="22" y="32" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="17" font-weight="500">Closer Than Ever</text>
    <text x="22" y="55" fill="#8ca9b7" font-family="-apple-system, sans-serif" font-size="13">B2 · 4:04</text>
  </g>

  <!-- 7. Step by Step -->
  <g transform="translate(36, 642)">
    <rect width="468" height="74" rx="16" fill="url(#trackCardGrad)" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1" />
    <text x="22" y="32" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="17" font-weight="500">Step by Step</text>
    <text x="22" y="55" fill="#8ca9b7" font-family="-apple-system, sans-serif" font-size="13">A2 · 3:05</text>
  </g>

  <!-- Bottom Navigation Pill -->
  <rect x="120" y="1090" width="300" height="74" rx="37" fill="rgba(19, 44, 56, 0.92)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  <!-- Music Tab -->
  <g transform="translate(162, 1114)" fill="#8da9b5">
    <circle cx="8" cy="13" r="5" fill="#8da9b5" />
    <rect x="11" y="4" width="2" height="9" fill="#8da9b5" />
  </g>

  <!-- Library Tab Active -->
  <rect x="232" y="1102" width="76" height="50" rx="20" fill="rgba(88, 140, 161, 0.45)" />
  <g transform="translate(258, 1114)" fill="#ffffff">
    <rect x="0" y="0" width="22" height="24" rx="3" fill="none" stroke="#ffffff" stroke-width="2" />
    <circle cx="11" cy="13" r="4" fill="#ffffff" />
  </g>

  <!-- Settings Tab -->
  <g transform="translate(348, 1114)" fill="#8da9b5">
    <circle cx="12" cy="12" r="5" stroke="#8da9b5" stroke-width="2" fill="none" />
    <path d="M12 1v3M12 20v3M1 12h3M20 12h3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" stroke="#8da9b5" stroke-width="2" />
  </g>

  <!-- Android Home Indicator -->
  <rect x="210" y="1186" width="120" height="4" rx="2" fill="#ffffff" opacity="0.6" />
